<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <!-- Resplandor exterior (Glow ambiental cálido) -->
    <radialGradient id="fireGlow" cx="50%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#ff4500" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#ff2200" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#aa0000" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Base cálida sin tonos azules -->
    <radialGradient id="warmBase" cx="50%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#800000" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#4a0000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1a0000" stop-opacity="0"/>
    </radialGradient>

    <!-- Llama exterior: Rojo profundo a naranja brillante -->
    <linearGradient id="outerFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#800000"/>
      <stop offset="15%" stop-color="#cc0000"/>
      <stop offset="40%" stop-color="#ff3300"/>
      <stop offset="75%" stop-color="#ff6600"/>
      <stop offset="92%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ffcc00" stop-opacity="0"/>
    </linearGradient>

    <!-- Llama media: Naranja vivo a amarillo incandescente -->
    <linearGradient id="midFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e62e00"/>
      <stop offset="30%" stop-color="#ff5500"/>
      <stop offset="65%" stop-color="#ffaa00"/>
      <stop offset="90%" stop-color="#ffee00"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Núcleo de alta temperatura: Amarillo a Blanco puro -->
    <linearGradient id="innerCore" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff8800"/>
      <stop offset="25%" stop-color="#ffcc00"/>
      <stop offset="60%" stop-color="#ffffaa"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Filtros de renderizado y suavizado -->
    <filter id="glowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="softFlame" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="sharpCore" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Resplandor térmico de fondo -->
  <circle cx="250" cy="400" r="210" fill="url(#fireGlow)" filter="url(#glowBlur)"/>

  <!-- Sombra de calor en la base -->
  <ellipse cx="250" cy="540" rx="130" ry="30" fill="url(#warmBase)"/>

  <!-- ===== CAPA 1: SILUETA Y LENGUAS EXTERIORES (Rojo/Naranja) ===== -->
  <g id="outerLayer">
    <path d="M 250 40 
             C 290 110, 315 160, 365 220 
             C 415 290, 445 360, 415 440 
             C 385 520, 325 560, 250 560 
             C 175 560, 115 520, 85 440 
             C 55 360, 105 280, 145 220 
             C 165 190, 185 140, 175 100 
             C 205 140, 225 190, 215 240 
             C 225 170, 232 90, 250 40 Z" 
          fill="url(#outerFlame)"/>
          
    <!-- Lengua lateral izquierda -->
    <path d="M 135 310 
             C 95 270, 75 220, 90 170 
             C 105 210, 125 240, 155 270 
             C 140 285, 135 300, 135 310 Z" 
          fill="url(#outerFlame)" opacity="0.9"/>

    <!-- Lengua lateral derecha -->
    <path d="M 355 330 
             C 405 290, 415 220, 395 160 
             C 380 210, 355 250, 330 280 
             C 345 295, 353 315, 355 330 Z" 
          fill="url(#outerFlame)" opacity="0.9"/>
  </g>

  <!-- ===== CAPA 2: CUERPO INTERMEDIO (Naranja/Amarillo) ===== -->
  <g id="midLayer" filter="url(#softFlame)">
    <path d="M 250 110 
             C 280 170, 340 250, 350 340 
             C 360 420, 320 510, 250 510 
             C 180 510, 140 420, 150 340 
             C 160 260, 210 170, 220 150 
             C 225 180, 215 230, 200 260 
             C 230 220, 240 160, 250 110 Z" 
          fill="url(#midFlame)"/>

    <!-- Detalle de llama interior oscilante -->
    <path d="M 205 240
             C 175 280, 165 330, 180 380
             C 190 330, 215 290, 235 260
             C 220 255, 210 248, 205 240 Z" 
          fill="url(#midFlame)"/>

    <path d="M 290 260
             C 315 295, 325 340, 310 390
             C 300 345, 280 305, 260 275
             C 275 270, 285 265, 290 260 Z" 
          fill="url(#midFlame)"/>
  </g>

  <!-- ===== CAPA 3: NÚCLEO Y CENTRO DE CALOR (Amarillo/Blanco) ===== -->
  <g id="innerLayer" filter="url(#sharpCore)">
    <!-- Núcleo amarillo -->
    <path d="M 250 210 
             C 275 260, 305 320, 300 400 
             C 295 470, 275 495, 250 495 
             C 225 495, 205 470, 200 400 
             C 195 320, 225 260, 250 210 Z" 
          fill="url(#innerCore)"/>

    <!-- Centro blanco candente -->
    <path d="M 250 280 
             C 265 320, 275 360, 270 420 
             C 265 465, 258 480, 250 480 
             C 242 480, 235 465, 230 420 
             C 225 360, 235 320, 250 280 Z" 
          fill="#ffffff"/>

    <!-- Destello directo en la base de la llama -->
    <ellipse cx="250" cy="440" rx="25" ry="35" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- ===== CAPA 4: CHISPAS Y BRASAS ASCENDENTES ===== -->
  <g id="sparks">
    <!-- Chispas grandes -->
    <circle cx="210" cy="110" r="3" fill="#ffee00" filter="url(#sharpCore)"/>
    <circle cx="285" cy="130" r="2.5" fill="#ffaa00"/>
    <circle cx="295" cy="70" r="2" fill="#ffffff" filter="url(#sharpCore)"/>
    <circle cx="175" cy="170" r="2" fill="#ff5500"/>
    
    <!-- Chispas pequeñas -->
    <circle cx="230" cy="30" r="1.5" fill="#ffffaa"/>
    <circle cx="260" cy="15" r="1" fill="#ffffff"/>
    <circle cx="150" cy="120" r="1.5" fill="#ffaa00"/>
    <circle cx="340" cy="180" r="1.5" fill="#ff3300"/>
    <circle cx="320" cy="100" r="1" fill="#ffee00"/>
    <circle cx="190" cy="60" r="1.2" fill="#ff8800"/>
    
    <!-- Micro chispas altas -->
    <circle cx="245" cy="5" r="0.8" fill="#ffffff"/>
    <circle cx="270" cy="40" r="0.8" fill="#ffee00"/>
    <circle cx="130" cy="200" r="0.8" fill="#ff5500"/>
  </g>
</svg>
