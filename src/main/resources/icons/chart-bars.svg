<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Fondo y sombras generales -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feOffset dx="0" dy="16" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradientes de línea y trayectoria -->
    <linearGradient id="mainLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="45%" stop-color="#8b5cf6"/>
      <stop offset="80%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Gradientes de nodos -->
    <radialGradient id="nodeGrad1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </radialGradient>

    <radialGradient id="nodeGrad2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>

    <radialGradient id="nodeGrad3" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#be185d"/>
    </radialGradient>

    <!-- Gradientes de tarjetas/hitos -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Base / Tablero UI -->
  <g filter="url(#cardShadow)">
    <rect x="35" y="35" width="430" height="430" rx="36" fill="#0b0f19" stroke="#1e293b" stroke-width="3"/>
    
    <!-- Red de cuadrícula de fondo (Grid suave) -->
    <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" opacity="0.4">
      <line x1="80" y1="35" x2="80" y2="465"/>
      <line x1="165" y1="35" x2="165" y2="465"/>
      <line x1="250" y1="35" x2="250" y2="465"/>
      <line x1="335" y1="35" x2="335" y2="465"/>
      <line x1="420" y1="35" x2="420" y2="465"/>
      
      <line x1="35" y1="120" x2="465" y2="120"/>
      <line x1="35" y1="205" x2="465" y2="205"/>
      <line x1="35" y1="290" x2="465" y2="290"/>
      <line x1="35" y1="375" x2="465" y2="375"/>
    </g>

    <!-- ===== LÍNEA TEMPORAL PRINCIPAL (S-CURVE DYNAMICS) ===== -->
    <!-- Sombra/Glow de la guía -->
    <path d="M 75 350 C 145 350, 145 180, 230 180 C 315 180, 315 280, 425 280" 
          fill="none" stroke="url(#mainLineGrad)" stroke-width="14" opacity="0.25" filter="url(#nodeGlow)"/>

    <!-- Línea conductora base -->
    <path d="M 75 350 C 145 350, 145 180, 230 180 C 315 180, 315 280, 425 280" 
          fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>

    <!-- Línea principal con degradado activo -->
    <path d="M 75 350 C 145 350, 145 180, 230 180 C 315 180, 315 280, 425 280" 
          fill="none" stroke="url(#mainLineGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Línea discontinua de progreso/proyección futura al final -->
    <path d="M 425 280 L 445 280" 
          fill="none" stroke="#f43f5e" stroke-width="4" stroke-dasharray="3 3" stroke-linecap="round" opacity="0.8"/>

    <!-- ===== CONEXIONES Y LÍNEAS VERTICALES DE HITOS ===== -->
    <!-- Conector Hito 1 (Abajo) -->
    <line x1="110" y1="350" x2="110" y2="415" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>
    
    <!-- Conector Hito 2 (Arriba) -->
    <line x1="230" y1="180" x2="230" y2="95" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>

    <!-- Conector Hito 3 (Abajo) -->
    <line x1="375" y1="280" x2="375" y2="365" stroke="#ec4899" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>

    <!-- ===== TARJETAS / TARJETAS DE HITOS DE LA TIMELINE ===== -->
    <!-- Tarjeta Hito 1 -->
    <g transform="translate(65, 385)">
      <rect x="0" y="0" width="90" height="42" rx="10" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5"/>
      <rect x="10" y="10" width="35" height="6" rx="3" fill="#3b82f6"/>
      <rect x="10" y="22" width="55" height="5" rx="2.5" fill="#475569"/>
      <circle cx="72" cy="21" r="7" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <!-- Checkmark -->
      <path d="M 69 21 L 71 23 L 75 19" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Tarjeta Hito 2 (Principal/Destacado) -->
    <g transform="translate(170, 70)" filter="url(#nodeGlow)">
      <rect x="0" y="0" width="120" height="54" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
      <rect x="12" y="12" width="50" height="8" rx="4" fill="url(#accentGlow)"/>
      <rect x="12" y="26" width="75" height="6" rx="3" fill="#94a3b8"/>
      <rect x="12" y="36" width="40" height="5" rx="2.5" fill="#475569"/>
      <!-- Badge de estado -->
      <rect x="80" y="10" width="28" height="14" rx="7" fill="#8b5cf6" opacity="0.2"/>
      <circle cx="94" cy="17" r="3" fill="#a78bfa"/>
    </g>

    <!-- Tarjeta Hito 3 -->
    <g transform="translate(330, 345)">
      <rect x="0" y="0" width="90" height="42" rx="10" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5"/>
      <rect x="10" y="10" width="40" height="6" rx="3" fill="#ec4899"/>
      <rect x="10" y="22" width="50" height="5" rx="2.5" fill="#475569"/>
      <circle cx="72" cy="21" r="6" fill="#f43f5e" opacity="0.2"/>
      <circle cx="72" cy="21" r="3" fill="#f43f5e"/>
    </g>

    <!-- ===== NODOS INTERACTIVOS (PUNTOS DE LA LÍNEA DE TIEMPO) ===== -->
    
    <!-- Nodo 1 (Completado) -->
    <g transform="translate(110, 350)">
      <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#3b82f6" stroke-width="3"/>
      <circle cx="0" cy="0" r="8" fill="url(#nodeGrad1)"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    </g>

    <!-- Nodo 2 (Activo / En Proceso - Con Pulso) -->
    <g transform="translate(230, 180)" filter="url(#nodeGlow)">
      <circle cx="0" cy="0" r="20" fill="#8b5cf6" opacity="0.25"/>
      <circle cx="0" cy="0" r="15" fill="#0f172a" stroke="#a78bfa" stroke-width="3"/>
      <circle cx="0" cy="0" r="9" fill="url(#nodeGrad2)"/>
      <circle cx="-2" cy="-2" r="3" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Nodo 3 (Hito Reciente) -->
    <g transform="translate(375, 280)">
      <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#ec4899" stroke-width="3"/>
      <circle cx="0" cy="0" r="8" fill="url(#nodeGrad3)"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    </g>

    <!-- Nodo 4 (Futuro / Final de línea) -->
    <g transform="translate(425, 280)">
      <circle cx="0" cy="0" r="8" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
      <circle cx="0" cy="0" r="3" fill="#f43f5e"/>
    </g>

    <!-- ===== DETALLES DE CORTE Y Brillos ===== -->
    <!-- Indicador de Tiempo / Flechas de Navegación superior -->
    <path d="M 410 75 L 420 65 L 430 75" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="420" cy="90" r="2" fill="#475569"/>
    <circle cx="420" cy="100" r="2" fill="#475569"/>

    <!-- Destellos Especulares -->
    <circle cx="225" cy="175" r="1.5" fill="#ffffff"/>
  </g>
</svg>
