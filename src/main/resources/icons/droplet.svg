<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <!-- Fondo y sombra de base -->
    <radialGradient id="dropShadow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0f2b48" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#0f2b48" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f2b48" stop-opacity="0"/>
    </radialGradient>

    <!-- Cuerpo principal de la gota (Profundidad) -->
    <radialGradient id="mainBody" cx="40%" cy="65%" r="60%" fx="30%" fy="70%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="25%" stop-color="#00a8f0"/>
      <stop offset="65%" stop-color="#004e92"/>
      <stop offset="90%" stop-color="#001d3d"/>
      <stop offset="100%" stop-color="#000d1a"/>
    </radialGradient>

    <!-- Resplandor de refracción interna (Bordo inferior) -->
    <linearGradient id="internalRefraction" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f7ff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#00aaff" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#0044ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Brillo especular principal (Superior) -->
    <linearGradient id="primaryHighlight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Reflexión curvada secundaria -->
    <linearGradient id="secondaryHighlight" x1="100%" y1="30%" x2="0%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Brillo de borde cáustico -->
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Filtros de desenfoque para suavizar sombras y reflejos -->
    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="blurSharp" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Sombra proyectada en la base -->
  <ellipse cx="250" cy="570" rx="130" ry="25" fill="url(#dropShadow)"/>
  <ellipse cx="250" cy="565" rx="70" ry="12" fill="#00f7ff" opacity="0.2" filter="url(#blurGlow)"/>

  <!-- Silueta base / Máscara de la gota -->
  <g id="waterDrop">
    <!-- Cuerpo Base denso -->
    <path d="M 250 50 
             C 265 140, 400 340, 400 440 
             A 150 150 0 1 1 100 440 
             C 100 340, 235 140, 250 50 Z" 
          fill="url(#mainBody)"/>

    <!-- Resplandor Caústico Inferior (Refracción de Luz) -->
    <path d="M 120 440 
             A 130 130 0 0 0 380 440 
             C 370 520, 310 565, 250 565 
             C 190 565, 130 520, 120 440 Z" 
          fill="url(#internalRefraction)" 
          style="mix-blend-mode: screen;"/>

    <!-- Brillo de Borde Interno (Efecto Fresnel) -->
    <path d="M 250 50 
             C 265 140, 400 340, 400 440 
             A 150 150 0 1 1 100 440 
             C 100 340, 235 140, 250 50 Z" 
          fill="none" 
          stroke="url(#rimLight)" 
          stroke-width="3" 
          opacity="0.7"/>

    <!-- Glow ambiental interno -->
    <path d="M 250 80 
             C 260 160, 370 340, 370 430 
             A 120 120 0 0 1 130 430 
             C 130 340, 240 160, 250 80 Z" 
          fill="none" 
          stroke="#00d8ff" 
          stroke-width="12" 
          opacity="0.15" 
          filter="url(#blurSoft)"/>

    <!-- Reflejo Especular Principal (Fuente de luz superior izquierda) -->
    <!-- Brillo grande suave -->
    <path d="M 235 95 
             C 240 130, 150 330, 145 400 
             C 140 450, 125 430, 135 370 
             C 145 310, 225 130, 235 95 Z" 
          fill="url(#primaryHighlight)" 
          opacity="0.4" 
          filter="url(#blurSharp)"/>
          
    <!-- Núcleo del brillo (Luz intensa directa) -->
    <path d="M 238 105 
             C 242 135, 160 320, 155 380 
             C 152 410, 142 400, 148 360 
             C 156 300, 228 135, 238 105 Z" 
          fill="#ffffff" 
          opacity="0.9"/>

    <!-- Punto de luz focal superior -->
    <ellipse cx="242" cy="115" rx="5" ry="12" transform="rotate(-18 242 115)" fill="#ffffff" filter="url(#blurSharp)"/>

    <!-- Reflejo Secundario (Luz de rebotada derecha) -->
    <path d="M 265 120 
             C 280 200, 360 350, 355 420 
             C 350 470, 338 460, 344 420 
             C 350 360, 272 200, 265 120 Z" 
          fill="url(#secondaryHighlight)" 
          opacity="0.55"/>

    <!-- Micro-brillos y detalles de superficie (Cáusticas menores) -->
    <!-- Detalle brillante inferior derecho -->
    <path d="M 320 480 
             A 110 110 0 0 1 250 545 
             C 285 545, 335 515, 345 470 
             C 347 460, 323 470, 320 480 Z" 
          fill="#ffffff" 
          opacity="0.45" 
          filter="url(#blurSharp)"/>

    <!-- Detalle brillante inferior izquierdo -->
    <path d="M 180 480 
             A 110 110 0 0 0 225 530 
             C 195 525, 165 495, 160 470 
             C 158 460, 178 470, 180 480 Z" 
          fill="#a5f3fc" 
          opacity="0.35" 
          filter="url(#blurSharp)"/>

    <!-- Gotas pequeñas de acento flotando alrededor (para mayor impacto visual) -->
    <!-- Gotita superior -->
    <circle cx="250" cy="25" r="4" fill="#00f7ff" opacity="0.7"/>
    <circle cx="249" cy="24" r="1.5" fill="#ffffff" opacity="0.9"/>
    
    <!-- Gotita lateral -->
    <circle cx="390" cy="280" r="2.5" fill="#00f7ff" opacity="0.5"/>
    <circle cx="105" cy="310" r="3.5" fill="#00f7ff" opacity="0.6"/>
    <circle cx="104" cy="309" r="1" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
